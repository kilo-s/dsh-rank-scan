name: build-and-release

# 为什么需要它：仓库里**不放编译产物**（lib/ 会复制源码注释、sourcemap 带绝对路径），
# 所以别人要用的包必须在 CI 里从源码构建出来 —— 打 tag 时自动构建并挂到 Release。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.1）；留空则只构建、不发布'
        required: false
        default: ''
      dry_run:
        description: '只构建与自测，不发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装开发依赖（typescript / @types/node）
        run: npm install --no-audit --no-fund

      - name: 构建（src → lib）
        run: npm run build

      - name: 离线自测（21 个测试文件）
        run: |
          fail=0
          for f in tests/*.test.mjs; do
            node "$f" || fail=1
          done
          exit $fail

      - name: 打包（含 lib/ 与 cordis.patch.yml）
        run: npm pack

      - name: 校验产物
        run: |
          tgz=$(ls -1 dsh-rank-scan-*.tgz dsh-external-dsh-rank-scan-*.tgz 2>/dev/null | head -n1)
          echo "包：$tgz"
          test -n "$tgz" || { echo "没有产出 tgz"; exit 1; }
          # 必须带编译产物与装配补丁，否则别人装上加载不了
          tar -tzf "$tgz" | grep -q 'package/lib/index.js' || { echo "包内缺 lib/index.js"; exit 1; }
          tar -tzf "$tgz" | grep -q 'package/lib/client.js' || { echo "包内缺 lib/client.js"; exit 1; }
          tar -tzf "$tgz" | grep -q 'package/cordis.patch.yml' || { echo "包内缺 cordis.patch.yml"; exit 1; }

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rank-scan-package
          path: "*.tgz"

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz=$(ls -1 dsh-rank-scan-*.tgz dsh-external-dsh-rank-scan-*.tgz 2>/dev/null | head -n1)
          gh release create "${{ github.ref_name }}" "$tgz"             --repo "${{ github.repository }}"             --title "${{ github.ref_name }}"             --notes "构建产物见下方附件。安装：先完全退出 DSH，再执行
          `dsh plugin --profile desktop add <附件 tgz 的本地路径>`
          或解压后运行 `pwsh -File scripts/install.ps1 -Spec \"<tgz 路径>\"`。"
