name: build-and-release

# 为什么需要它：仓库里不放编译产物（lib/ 是源码的复制品、sourcemap 还带构建机的绝对路径，产物还会与源码漂移），
# 所以可分发的包必须在 CI 里从源码构建。
# 打 tag 时：构建 → 自测 → 打包 → 校验 → 挂 Release 附件 → 发布到 npm。
# npm 发布走 **Trusted Publishing（OIDC）**：不需要任何长期 token、也不需要 OTP；
# 前提是该包在 npm 上配过一次 Trusted Publisher（仓库 kilo-s/dsh-rank-scan + 本文件名 build.yml）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建与自测，不发布'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write     # Trusted Publishing 必需

# 测试里的时间戳是 +08:00 语义（数据日期 = 本地自然日），把运行环境固定成 Asia/Shanghai，
# 否则 UTC runner 上「凌晨 01:30 也算当天」这类断言会整片变红。
env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装开发依赖（typescript / @types/node）
        run: npm install --no-audit --no-fund

      - name: 构建（src → lib，并把面板 bundle 复制进 lib）
        run: npm run build

      # ★ 2026-10-25：发布链原来不跑 typecheck —— 测试全绿但类型有错也能发出去。
      - name: 类型检查（tsc --noEmit）
        run: npm run typecheck

      - name: 离线自测（tests/*.test.mjs）
        run: |
          fail=0
          for f in tests/*.test.mjs; do
            node "$f" || fail=1
          done
          exit $fail

      - name: 打包
        run: npm pack

      # ★ 2026-10-25：发布前必须过与 checks 同一套离线验收闸门。
      #   旧实现只跑 tests/*.test.mjs ⇒ 公开面闸（禁词 / 个人绝对路径 / 死链）、提交信息闸门、
      #   装配闸（面板源与产物一致）在发布链上**完全没有把关**：红灯只出现在 checks 里，
      #   而 build 链并不依赖 checks ⇒ 带病也能 tag 发布。
      #   放在 npm pack 之后，顺带让 acceptance 的 tgz 体积闸也真正生效（没有 tgz 时它只是 SKIP）。
      - name: 验收闸门（离线，与 checks 同一判据）
        run: pwsh -NoProfile -File scripts/acceptance.ps1 -SkipLive

      - name: 校验产物
        run: |
          tgz=$(ls -1 dsh-rank-scan-*.tgz 2>/dev/null | head -n1)
          echo "包：$tgz"
          test -n "$tgz" || { echo "没有产出 tgz"; exit 1; }
          tar -tzf "$tgz" | grep -q "package/lib/index.js" || { echo "包内缺 lib/index.js"; exit 1; }
          tar -tzf "$tgz" | grep -q "package/lib/client.js" || { echo "包内缺 lib/client.js"; exit 1; }
          tar -tzf "$tgz" | grep -q "package/cordis.patch.yml" || { echo "包内缺 cordis.patch.yml"; exit 1; }
          if tar -tzf "$tgz" | grep -q "dshclaim"; then echo "包内混入会话认领标记"; exit 1; fi

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rank-scan-package
          path: "*.tgz"

      # Release 说明 = 该版本在 CHANGELOG.md 里的那一段 + 安装指引。
      # ★ 2026-10-25：改由 Node CLI 生成。旧实现在 bash 双引号里写反引号 ⇒ 先做命令替换，
      #   附件名与安装命令被整段吃掉（公开的 v0.2.4 Release 正文已实证）。
      #   同一个 CLI 还会校验 tag 与 package.json 版本一致、版本段存在且非空 ——
      #   因此「版本对不上」会在创建任何 Release **之前**就红，而不是发出去再发现。
      - name: 生成 Release 说明（本版 CHANGELOG 段，并校验 tag 与包版本）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --package package.json --changelog CHANGELOG.md --out /tmp/release-notes.md
          cat /tmp/release-notes.md

      # ★ 2026-10-25：dry_run 守卫。workflow_dispatch 的 dry_run 默认 true，
      #   旧实现这里没有守卫 ⇒ 手动跑一次「只构建」也会真的创建/覆盖公开 Release。
      #   （push 触发时 github.event.inputs 为 null，表达式为真，照常发布。）
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz=$(ls -1 dsh-rank-scan-*.tgz 2>/dev/null | head -n1)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release 已存在：覆盖附件并用本版 CHANGELOG 重写说明"
            gh release upload "${GITHUB_REF_NAME}" "$tgz" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "$tgz" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          fi

      # 最后一步：发布到 npm。失败就让 workflow 变红（不静默跳过）——
      # 红的原因通常只有两种：该包还没配 Trusted Publisher，或这个版本号已经发过。
      - name: 发布到 npm（Trusted Publishing / OIDC）
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        run: |
          npm install -g npm@latest    # OIDC 发布需要 npm >= 11.5
          npm --version
          npm publish --access public --provenance --registry https://registry.npmjs.org/
